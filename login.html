<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' https://*.supabase.co https://*.gstatic.com https://cdn.jsdelivr.net https://unpkg.com; img-src 'self' data: https://*.supabase.co https://*.gstatic.com https://i.pravatar.cc https://*.googleusercontent.com https://*.openstreetmap.org; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com https://*.supabase.co; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net https://unpkg.com;">
    <meta name="description"
        content="Sign in to MessageHunt Business Creator Portal - Buy coins and promote your brand across India.">
    <title>Creator Portal Login - MessageHunt</title>
    <link rel="icon" type="image/png" href="ic_launcher.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@0.344.0"></script>
    <style>
        body {
            background-color: var(--bg-deep);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background:
                radial-gradient(ellipse at 30% 20%, rgba(124, 58, 237, 0.25) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 80%, rgba(245, 158, 11, 0.15) 0%, transparent 60%),
                var(--bg-deep);
        }

        .login-container {
            position: relative;
            width: 100%;
            max-width: 460px;
            padding: 20px;
        }

        .login-card {
            background: var(--bg-surface-elevated);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 48px 36px;
            text-align: center;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.7);
            position: relative;
            overflow: hidden;
        }

        .brand-logo {
            font-size: 1.6rem;
            letter-spacing: 2px;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .google-btn {
            background-color: #ffffff;
            color: #1f2937;
            border: none;
            border-radius: 14px;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: var(--transition);
            width: 100%;
            justify-content: center;
            margin-top: 24px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .google-btn:hover {
            background-color: #f9fafb;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .google-icon {
            width: 20px;
            height: 20px;
        }

        .demo-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            border-radius: 14px;
            padding: 12px 24px;
            font-weight: 600;
            width: 100%;
            margin-top: 12px;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .demo-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--primary-bright);
        }

        .auth-error-banner {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 16px;
            padding: 16px;
            margin-top: 20px;
            text-align: left;
            font-size: 0.85rem;
            color: #fca5a5;
        }

        .auth-error-title {
            color: #ef4444;
            font-weight: 700;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .auth-error-steps {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 10px 12px;
            margin-top: 10px;
            color: var(--text-muted);
            font-size: 0.8rem;
            line-height: 1.4;
        }

        .auth-error-steps code {
            color: var(--accent-bright);
            word-break: break-all;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-content">
                <img src="ic_launcher.png" alt="MessageHunt Icon" width="64" height="64" class="rounded-3 mb-3 shadow-lg">
                <div class="brand-logo gradient-text-purple">CREATOR PORTAL</div>
                <p class="subtitle mb-2">Sign in to buy coins and promote your brand with location drops across India</p>

                <div id="authErrorAlert" class="auth-error-banner d-none"></div>

                <button id="googleSignInBtn" class="google-btn">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google"
                        class="google-icon">
                    Sign in with Google
                </button>

                <a href="index.html" class="d-block mt-4 text-decoration-none small text-muted">
                    ← Back to Product Home
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js?v=5"></script>
    <script>
        (function () {
            const alertEl = document.getElementById('authErrorAlert');
            const btn = document.getElementById('googleSignInBtn');

            function showAuthError(message, extraHtml) {
                if (!alertEl) {
                    alert(message);
                    return;
                }
                alertEl.innerHTML = `
                    <div class="auth-error-title">
                        <i data-lucide="alert-triangle" style="width:18px;height:18px;"></i>
                        Authentication Failed
                    </div>
                    <div>${message}</div>
                    ${extraHtml || ''}
                `;
                alertEl.classList.remove('d-none');
                if (window.lucide) lucide.createIcons();
            }

            if (window.lucide) lucide.createIcons();

            const config = window.APP_CONFIG;
            if (!config || !config.SUPABASE_URL || !config.SUPABASE_ANON_KEY) {
                showAuthError('App config failed to load. Hard-refresh the page (Cmd+Shift+R) and try again.');
                return;
            }

            if (typeof supabase === 'undefined') {
                showAuthError('Supabase library failed to load. Check your network and try again.');
                return;
            }

            const supabaseClient = supabase.createClient(config.SUPABASE_URL, config.SUPABASE_ANON_KEY);

            function checkAuthErrorInUrl() {
                const searchParams = new URLSearchParams(window.location.search);
                const hashString = window.location.hash.startsWith('#') ? window.location.hash.substring(1) : window.location.hash;
                const hashParams = new URLSearchParams(hashString);

                const error = searchParams.get('error') || hashParams.get('error');
                const errorDescription = searchParams.get('error_description') || hashParams.get('error_description');

                if (error || errorDescription) {
                    const decodedDesc = decodeURIComponent(errorDescription || error || 'Google sign in failed');
                    let troubleshootingHtml = '';
                    if (decodedDesc.includes('Unable to exchange external code') || decodedDesc.includes('4/0A')) {
                        troubleshootingHtml = `
                            <div class="auth-error-steps">
                                <strong>How to resolve in Supabase & Google Cloud:</strong>
                                <ol class="ps-3 mb-0 mt-1">
                                    <li>Verify Google <em>Client Secret</em> in <strong>Supabase Dashboard &rarr; Auth &rarr; Providers &rarr; Google</strong></li>
                                    <li>Set Authorized Redirect URI in <strong>Google Cloud Console</strong>: <code>${config.SUPABASE_URL}/auth/v1/callback</code></li>
                                    <li>Add <code>${new URL('dashboard.html', window.location.href).href}</code> to <strong>Supabase Auth Redirect URLs</strong>.</li>
                                </ol>
                            </div>
                        `;
                    }
                    showAuthError(decodedDesc, troubleshootingHtml);
                }
            }

            async function signInWithGoogle() {
                if (!btn) return;

                const originalLabel = btn.innerHTML;
                btn.disabled = true;
                btn.textContent = 'Redirecting to Google…';

                try {
                    const redirectTo = new URL('dashboard.html', window.location.href).href;
                    const { data, error } = await supabaseClient.auth.signInWithOAuth({
                        provider: 'google',
                        options: {
                            redirectTo,
                            skipBrowserRedirect: false
                        }
                    });

                    if (error) {
                        throw error;
                    }

                    // Explicit navigation — more reliable than relying on the client redirect alone
                    if (data && data.url) {
                        window.location.assign(data.url);
                        return;
                    }

                    throw new Error('No OAuth URL returned from Supabase');
                } catch (err) {
                    console.error('Error logging in:', err);
                    showAuthError(err.message || 'Authentication failed');
                    btn.disabled = false;
                    btn.innerHTML = originalLabel;
                }
            }

            if (btn) {
                btn.addEventListener('click', signInWithGoogle);
            }

            checkAuthErrorInUrl();

            supabaseClient.auth.onAuthStateChange((event, session) => {
                if (session) {
                    window.location.href = new URL('dashboard.html', window.location.href).href;
                }
            });
        })();
    </script>
</body>

</html>
