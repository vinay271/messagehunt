<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' https://*.supabase.co https://*.gstatic.com https://cdn.jsdelivr.net https://unpkg.com; img-src 'self' data: https://*.supabase.co https://*.gstatic.com https://i.pravatar.cc https://*.googleusercontent.com https://*.openstreetmap.org; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com https://*.supabase.co; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com;">
    <meta name="description"
        content="Sign in to MessageHunt Business Creator Portal - Buy coins and promote your brand across India.">
    <title>Creator Portal Login - MessageHunt</title>
    <link rel="icon" type="image/png" href="ic_launcher.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@0.344.0"></script>
    <style>
        body {
            background-color: var(--bg-deep);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background:
                radial-gradient(ellipse at 30% 20%, rgba(124, 58, 237, 0.25) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 80%, rgba(245, 158, 11, 0.15) 0%, transparent 60%),
                var(--bg-deep);
        }

        .login-container {
            position: relative;
            width: 100%;
            max-width: 460px;
            padding: 20px;
        }

        .login-card {
            background: var(--bg-surface-elevated);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 48px 36px;
            text-align: center;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.7);
            position: relative;
            overflow: hidden;
        }

        .brand-logo {
            font-size: 1.6rem;
            letter-spacing: 2px;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .google-btn {
            background-color: #ffffff;
            color: #1f2937;
            border: none;
            border-radius: 14px;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: var(--transition);
            width: 100%;
            justify-content: center;
            margin-top: 24px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .google-btn:hover {
            background-color: #f9fafb;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .google-icon {
            width: 20px;
            height: 20px;
        }

        .demo-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            border-radius: 14px;
            padding: 12px 24px;
            font-weight: 600;
            width: 100%;
            margin-top: 12px;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .demo-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--primary-bright);
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-content">
                <img src="ic_launcher.png" alt="MessageHunt Icon" width="64" height="64" class="rounded-3 mb-3 shadow-lg">
                <div class="brand-logo gradient-text-purple">CREATOR PORTAL</div>
                <p class="subtitle mb-2">Sign in to buy coins and promote your brand with location drops across India</p>

                <button id="googleSignInBtn" class="google-btn">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google"
                        class="google-icon">
                    Sign in with Google
                </button>

                <a href="index.html" class="d-block mt-4 text-decoration-none small text-muted">
                    ← Back to Product Home
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module">
        import config from './config.js';

        lucide.createIcons();
        const supabaseClient = supabase.createClient(config.SUPABASE_URL, config.SUPABASE_ANON_KEY);

        async function signInWithGoogle() {
            const { data, error } = await supabaseClient.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: window.location.origin + '/dashboard.html'
                }
            });

            if (error) {
                console.error('Error logging in:', error.message);
                alert('Authentication failed: ' + error.message);
            }
        }

        document.getElementById('googleSignInBtn').addEventListener('click', signInWithGoogle);

        // Check for existing session
        supabaseClient.auth.onAuthStateChange((event, session) => {
            if (session) {
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>

</html>
